# Stack Archote PPA Distribuidora limpa para Dokploy
services:
  postgres_ppa:
    image: "postgres:17-alpine"
    restart: unless-stopped
    environment:
      POSTGRES_USER: "n8n"
      POSTGRES_PASSWORD: "${DB_POSTGRESDB_PASSWORD:-n8n_password}"
      POSTGRES_DB: "ppa_n8n"
    volumes:
      - archote_ppa_postgres_data:/var/lib/postgresql/data

  redis_ppa:
    image: "redis:6-alpine"
    restart: unless-stopped

  n8n_ppa:
    image: makarioszen/i9dig-n8n
    restart: unless-stopped
    environment:
      NODE_ENV: production
      N8N_PORT: 5678
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_HOST: coolify-archote-ppa.inovage.digital
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://coolify-archote-ppa.inovage.digital/
      GENERIC_TIMEZONE: America/Sao_Paulo
      NODE_FUNCTION_ALLOW_EXTERNAL: odbc,qs
      NODE_FUNCTION_ALLOW_BUILTIN: fs
      N8N_REDIS_HOST: redis_ppa
      N8N_REDIS_PORT: 6379
      N8N_QUEUE_MODE: "true"
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres_ppa
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ppa_n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${DB_POSTGRESDB_PASSWORD:-n8n_password}
      EXECUTIONS_PROCESS: main
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    depends_on:
      - postgres_ppa
      - redis_ppa
    volumes:
      - archote_n8n_data_ppa:/data

volumes:
  archote_n8n_data_ppa:
  archote_ppa_postgres_data:
